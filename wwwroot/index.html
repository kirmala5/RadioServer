<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RadioServer — Интернет-радио</title>
    <link rel="stylesheet" href="style.css?v=2">
</head>
<body>
    <div class="bg-glow" aria-hidden="true"></div>

    <header class="site-header">
        <div class="container header-inner">
            <a href="/" class="logo">Radio<span style="color:var(--plaza-accent)">Server</span></a>
            <nav>
                <a href="#">Станции</a>
                <a href="/stations">API</a>
            </nav>
        </div>
    </header>

    <div class="container">
        <main>
            <!-- Аудио скрыто — управление кастомным интерфейсом -->
            <audio id="audio" preload="none" style="display: none;"></audio>

            <section class="now-playing" id="nowPlaying">
                <div class="now-playing-inner">
                    <div class="artwork" id="stationArtwork" aria-label="Обложка станции">
                        <img class="artwork-img" id="stationArtworkImg" src="" alt="">
                        <span class="station-letter" id="stationLetter" style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:48px;font-weight:900;color:#fff;letter-spacing:-2px;">?</span>
                    </div>
                    <div class="track-info">
                        <div class="station-name" id="stationName">Ничего не играет</div>
                        <div class="track-title" id="trackTitle">Выберите станцию</div>
                    </div>
                </div>
                <div class="player-controls">
                    <button id="btnPlay" class="btn-play" aria-label="Воспроизвести">▶</button>
                    <button id="btnPause" class="btn-pause" disabled aria-label="Пауза">⏸</button>
                    <div class="progress" id="progress">
                        <div class="progress-fill" id="progressFill"></div>
                        <div class="progress-thumb" id="progressThumb"></div>
                    </div>
                    <span class="time" id="timeDisplay">0:00</span>
                    <div class="listeners" id="listenersDisplay">
                        <span class="listeners-dot"></span>
                        <span id="listenersCount">—</span> слушателей
                    </div>
                </div>
                <div class="waveform" id="waveform"></div>
            </section>

            <h2 class="section-title">Станции</h2>
            <div class="stations-grid" id="stationsGrid">
                <div class="empty-state">Загрузка станций…</div>
            </div>
        </main>

        <footer class="site-footer">
            <div class="container">
                <span>RadioServer &middot; HTTP-потоковая передача аудио на ASP.NET Core</span>
                <span>/stream/{станция} &middot; /stations</span>
            </div>
        </footer>
    </div>

    <script src="player.js?v=2"></script>
</body>
</html>
